global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'chaoslab-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['chaoslab-backend:8000', 'host.docker.internal:8000', 'localhost:8000']

  - job_name: 'product-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['product-service:8001', 'host.docker.internal:8001', 'localhost:8001']

  - job_name: 'order-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-service:8002', 'host.docker.internal:8002', 'localhost:8002']
