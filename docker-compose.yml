version: '3.8'

networks:
  chaoslab-net:
    driver: bridge

volumes:
  chaoslab_data:
  prometheus_data:
  grafana_data:

services:
  # ----------------------------------------------------------------------------
  # Product Service (Application Under Test)
  # ----------------------------------------------------------------------------
  product-service:
    build:
      context: ./services/product_service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PRODUCT_DB_PATH=/app/data/products.db
    volumes:
      - chaoslab_data:/app/data
    networks:
      - chaoslab-net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Order Service (Application Under Test)
  # ----------------------------------------------------------------------------
  order-service:
    build:
      context: ./services/order_service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - ORDER_DB_PATH=/app/data/orders.db
      - PRODUCT_SERVICE_URL=http://product-service:8001
    volumes:
      - chaoslab_data:/app/data
    networks:
      - chaoslab-net
    depends_on:
      product-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # ChaosLab Backend (Control Plane & Orchestrator)
  # ----------------------------------------------------------------------------
  chaoslab-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chaoslab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CHAOSLAB_PORT=8000
      - CHAOSLAB_HOST=0.0.0.0
      - CHAOSLAB_DB_PATH=/app/data/chaoslab.db
      - PRODUCT_SERVICE_URL=http://product-service:8001
      - ORDER_SERVICE_URL=http://order-service:8002
      - HEALTH_CHECK_INTERVAL_SECONDS=1.5
      - RECOVERY_TIMEOUT_SECONDS=30
      - DETECTION_TIMEOUT_SECONDS=25
      - ENABLE_DOCKER_CHAOS=true
    volumes:
      - chaoslab_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - chaoslab-net
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # ChaosLab Frontend (React + Vite + Tailwind Dashboard)
  # ----------------------------------------------------------------------------
  chaoslab-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chaoslab-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - chaoslab-net
    depends_on:
      - chaoslab-backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M

  # ----------------------------------------------------------------------------
  # Prometheus Telemetry Collector
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: chaoslab-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - chaoslab-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Grafana Observability Dashboard
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: chaoslab-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=chaoslab
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - chaoslab-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
